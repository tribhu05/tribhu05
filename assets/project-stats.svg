<svg viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <defs>
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E2DE2"/>
      <stop offset="100%" stop-color="#00C9FF"/>
    </linearGradient>
    <linearGradient id="gradPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E2DE2"/>
      <stop offset="100%" stop-color="#FF2E92"/>
    </linearGradient>
    <filter id="barGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="200" fill="#0a0014"/>

  <!-- CropGuard bar -->
  <text x="20" y="45" fill="#00E5FF" font-size="15" font-weight="600">CropGuard — ConvNeXt-Tiny</text>
  <rect x="20" y="58" width="820" height="18" rx="9" fill="#1a0630" stroke="#2a1145"/>
  <rect x="20" y="58" width="0" height="18" rx="9" fill="url(#gradCyan)" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="804" dur="1.8s" begin="0.2s" fill="freeze"/>
  </rect>
  <text x="860" y="72" text-anchor="end" fill="#ffffff" font-size="14" font-weight="700" opacity="0">
    98%
    <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.4s" fill="freeze"/>
  </text>

  <!-- BrainTumorNet bar -->
  <text x="20" y="115" fill="#FF7EC0" font-size="15" font-weight="600">BrainTumorNet — VGG16</text>
  <rect x="20" y="128" width="820" height="18" rx="9" fill="#1a0630" stroke="#2a1145"/>
  <rect x="20" y="128" width="0" height="18" rx="9" fill="url(#gradPink)" filter="url(#barGlow)">
    <animate attributeName="width" from="0" to="779" dur="1.8s" begin="0.5s" fill="freeze"/>
  </rect>
  <text x="860" y="142" text-anchor="end" fill="#ffffff" font-size="14" font-weight="700" opacity="0">
    ~95%
    <animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.4s" fill="freeze"/>
  </text>

  <text x="20" y="180" fill="#6b7280" font-size="11">test accuracy</text>
</svg>
