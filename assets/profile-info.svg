<svg viewBox="0 0 820 220" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E2DE2"/>
      <stop offset="50%" stop-color="#4A00E0"/>
      <stop offset="100%" stop-color="#00C9FF"/>
    </linearGradient>
    <filter id="cardGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="820" height="220" fill="#0a0014"/>

  <!-- static card base -->
  <rect x="10" y="10" width="800" height="200" rx="18" fill="#0d0018" stroke="#241238" stroke-width="1.5"/>

  <!-- animated light-trail border -->
  <rect x="10" y="10" width="800" height="200" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"
        stroke-linecap="round" stroke-dasharray="180 1820" filter="url(#cardGlow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-2000" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Row 1: Role -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.6s" fill="freeze"/>
    <circle cx="46" cy="66" r="5" fill="#00C9FF" filter="url(#dotGlow)">
      <animate attributeName="r" values="4;6;4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="68" y="72" font-size="16">
      <tspan fill="#ffffff" font-weight="700">Role</tspan>
      <tspan fill="#6b7280"> — </tspan>
      <tspan fill="#c9d1d9">AI/ML Undergraduate</tspan>
    </text>
  </g>

  <!-- Row 2: Languages -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.6s" fill="freeze"/>
    <circle cx="46" cy="110" r="5" fill="#8E2DE2" filter="url(#dotGlow)">
      <animate attributeName="r" values="4;6;4" dur="1.8s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <text x="68" y="116" font-size="16">
      <tspan fill="#ffffff" font-weight="700">Languages</tspan>
      <tspan fill="#6b7280"> — </tspan>
      <tspan fill="#c9d1d9">C++ · Python · Java · JavaScript</tspan>
    </text>
  </g>

  <!-- Row 3: Focus -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.6s" fill="freeze"/>
    <circle cx="46" cy="154" r="5" fill="#FF2E92" filter="url(#dotGlow)">
      <animate attributeName="r" values="4;6;4" dur="1.8s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <text x="68" y="160" font-size="16">
      <tspan fill="#ffffff" font-weight="700">Focus</tspan>
      <tspan fill="#6b7280"> — </tspan>
      <tspan fill="#c9d1d9">Computer Vision · Deep Learning · DSA · Software Engineering</tspan>
    </text>
  </g>

  <!-- blinking cursor -->
  <rect x="66" y="182" width="9" height="16" fill="#00E5FF" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.1s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="1.4s" repeatCount="indefinite"/>
  </rect>
</svg>
