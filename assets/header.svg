<svg width="1000" height="260" viewBox="0 0 1000 260"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B2FF7"/>
      <stop offset="50%" stop-color="#4A00E0"/>
      <stop offset="100%" stop-color="#00C9FF"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2"
                    flood-color="#000000"
                    flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Soft glow -->
  <path
    d="M390 45
       C430 10 540 15 590 45
       C645 78 640 155 590 190
       C535 228 430 225 390 180
       C350 135 350 80 390 45Z"
    fill="url(#gradient)"
    opacity="0.28"
    filter="url(#glow)"
  />

  <!-- Main gradient shape -->
  <path
    d="M390 45
       C430 10 540 15 590 45
       C645 78 640 155 590 190
       C535 228 430 225 390 180
       C350 135 350 80 390 45Z"
    fill="url(#gradient)"
  />

  <!-- Name -->
  <text
    x="500"
    y="105"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="46"
    font-weight="700"
    fill="white"
    stroke="black"
    stroke-width="3"
    stroke-linejoin="round"
    paint-order="stroke fill"
    filter="url(#shadow)">
    Tribhuwan Singh
  </text>

  <!-- Subtitle -->
  <text
    x="500"
    y="140"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="19"
    font-weight="600"
    fill="white"
    stroke="black"
    stroke-width="2"
    stroke-linejoin="round"
    paint-order="stroke fill">
    AI/ML Undergraduate | Aspiring AI-Engineer
  </text>

</svg>
