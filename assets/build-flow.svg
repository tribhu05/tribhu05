<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E2DE2"/>
      <stop offset="50%" stop-color="#4A00E0"/>
      <stop offset="100%" stop-color="#00C9FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="320" fill="#0a0014"/>

  <!-- ===== Connectors ===== -->
  <!-- top: Computer Vision -> Explainable Models -->
  <path d="M 260 70 L 620 70" stroke="url(#grad1)" stroke-width="2.5" fill="none" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <polygon points="620,70 608,64 608,76" fill="#00C9FF"/>

  <!-- right: Explainable Models -> Software Engineering -->
  <path d="M 770 100 L 770 220" stroke="url(#grad1)" stroke-width="2.5" fill="none" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <polygon points="770,220 764,208 776,208" fill="#00C9FF"/>

  <!-- bottom: Software Engineering -> C++ / DSA -->
  <path d="M 620 250 L 260 250" stroke="url(#grad1)" stroke-width="2.5" fill="none" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <polygon points="260,250 272,244 272,256" fill="#8E2DE2"/>

  <!-- left: C++ / DSA -> Computer Vision -->
  <path d="M 130 220 L 130 100" stroke="url(#grad1)" stroke-width="2.5" fill="none" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <polygon points="130,100 124,112 136,112" fill="#8E2DE2"/>

  <!-- ===== Nodes ===== -->
  <!-- Computer Vision -->
  <g filter="url(#glow)">
    <rect x="40" y="35" width="220" height="70" rx="14" fill="#12001f" stroke="#00C9FF" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="150" y="65" text-anchor="middle" fill="#00E5FF" font-size="15" font-weight="600">🖼️ Computer Vision</text>
  <text x="150" y="86" text-anchor="middle" fill="#6b7280" font-size="11">image models &amp; pipelines</text>

  <!-- Explainable Models -->
  <g filter="url(#glow)">
    <rect x="630" y="35" width="220" height="70" rx="14" fill="#12001f" stroke="#00C9FF" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="740" y="65" text-anchor="middle" fill="#00E5FF" font-size="15" font-weight="600">🧪 Explainable Models</text>
  <text x="740" y="86" text-anchor="middle" fill="#6b7280" font-size="11">Grad-CAM &amp; interpretability</text>

  <!-- Software Engineering -->
  <g filter="url(#glow)">
    <rect x="630" y="215" width="220" height="70" rx="14" fill="#12001f" stroke="#FF2E92" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="740" y="245" text-anchor="middle" fill="#FF2E92" font-size="15" font-weight="600">🛠️ Software Engineering</text>
  <text x="740" y="266" text-anchor="middle" fill="#6b7280" font-size="11">deployment &amp; system design</text>

  <!-- C++ / DSA -->
  <g filter="url(#glow)">
    <rect x="40" y="215" width="220" height="70" rx="14" fill="#12001f" stroke="#FF2E92" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="150" y="245" text-anchor="middle" fill="#FF2E92" font-size="15" font-weight="600">⚙️ C++ / DSA</text>
  <text x="150" y="266" text-anchor="middle" fill="#6b7280" font-size="11">algorithms &amp; foundations</text>
</svg>

