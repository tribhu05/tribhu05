<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>

  <g transform="translate(70,78)">
    <g>
      <!-- top face -->
      <polygon points="0,-40 35,-20 0,0 -35,-20" fill="url(#top)" stroke="#111827" stroke-width="1">
        <animate attributeName="fill-opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite"/>
      </polygon>
      <!-- left face -->
      <polygon points="-35,-20 0,0 0,40 -35,20" fill="url(#left)" stroke="#111827" stroke-width="1"/>
      <!-- right face -->
      <polygon points="35,-20 0,0 0,40 35,20" fill="url(#right)" stroke="#111827" stroke-width="1"/>

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="6s"
        repeatCount="indefinite"/>
    </g>
  </g>
</svg>
